; =============================================================================
; AltTabFix.ini - Configuration for AltTabFix NVSE Plugin
;
; Place this file next to AltTabFix.dll in:
;   Data/NVSE/Plugins/AltTabFix.ini
;
; Values: 1 = enabled, 0 = disabled
; =============================================================================

[Main]
; Force borderless windowed mode (the main alt-tab fix)
; This is the core feature -- it prevents D3D9 device loss on alt-tab
bBorderlessWindowed=1

; Auto-pause the game when you alt-tab out
bPauseOnFocusLoss=1

; Mute game audio when alt-tabbed out
bMuteOnFocusLoss=1

; Confine the mouse cursor to the game window when focused
; Prevents cursor from drifting to other monitors
bClipCursor=1

[Display]
; Custom resolution (0 = use your desktop resolution)
; Only change these if you want the game at a different resolution than native
iCustomWidth=0
iCustomHeight=0

; Which monitor to use (0 = primary monitor)
iMonitor=0

; Keep the window always on top (try enabling if you get focus issues)
bTopMost=0
