# Skyrim Reforged — cinematics / screenarchery overlay
#
# Opt-in. Merged only when you ask for it:
#
#     python3 ../build_collection.py . --overlay cinematics
#
# Tooling for composing and capturing shots, plus the animation plumbing that
# makes custom animations actually play correctly. Builds a separately named
# collection so the base build is untouched.
#
# NOT included: the recorder itself. Video capture is OBS or ShadowPlay, not a
# mod — nothing in Skyrim's engine records video. These mods get you a
# controllable camera, posable actors and a clean frame; the capture is external.

collection:
  name_suffix: " (Cinematics)"

prerequisites:
  - name: A screen recorder
    url: https://obsproject.com/
    notes: >
      OBS Studio is the usual answer and is free. Capture at your monitor's
      refresh rate, and if you are using time-freeze in Photo Mode remember the
      recorder keeps rolling while the game is paused — trim in post.

  - name: ENB or ReShade (optional but usual)
    url: http://enbdev.com/
    notes: >
      Depth of field is what makes shots read as cinematic rather than as
      gameplay screenshots, and neither the vanilla engine nor Photo Mode gives
      you real bokeh. Not in the collection: ENB binaries are distributed from
      enbdev.com, not Nexus, so they cannot be collection entries.

mods:
  # -------------------------------------------------------------------------
  # Camera and capture
  # -------------------------------------------------------------------------
  - name: Photo Mode
    mod_id: 91701
    phase: 2
    category: Cinematics
    rules:
      after:
        - MCM Helper
    notes: >
      The centrepiece. Composition grid overlays, FOV, camera roll/tilt, frozen
      and slowed time, weather selection, character visibility toggles, facial
      expressions and actor position/rotation. Most of what a dedicated
      machinima toolkit would give you, in one mod.

  - name: SmoothCam
    mod_id: 41252
    phase: 2
    category: Cinematics
    notes: >
      Frame-interpolated third-person camera with per-state offsets. Matters for
      recording specifically: vanilla's camera snaps, and snapping reads as
      cheap on video in a way it does not while playing.

  - name: Improved Camera SE
    mod_id: 93962
    phase: 2
    category: Cinematics
    rules:
      after:
        - SmoothCam
    notes: >
      A real first-person body — you see your own legs, and third-person
      animations play in first person. Has explicit SmoothCam conflict handling,
      so install it after and let it win.

  # -------------------------------------------------------------------------
  # Posing and expression
  # -------------------------------------------------------------------------
  - name: Poser Hotkeys Plus SSE
    mod_id: 17743
    phase: 2
    category: Cinematics
    rules:
      after:
        - Photo Mode
    notes: >
      Pose playback with a searchable menu, hotkeys and frame stepping — the
      tool for putting actors in a deliberate position rather than catching them
      mid-idle. Ships no poses of its own; it plays pose packs you add.

  - name: Additional Expressions Project - Addon for Poser Hotkeys Plus
    mod_id: 72337
    phase: 2
    category: Cinematics
    rules:
      after:
        - Poser Hotkeys Plus SSE
    notes: Extra facial expression presets driveable from the Poser Hotkeys menu.

  - name: Conditional Expressions Extended
    mod_id: 91438
    phase: 2
    category: Cinematics
    notes: >
      Moves facial animation into an SKSE plugin with expressions loaded from
      JSON. Faces stop being blank between scripted beats, which is the single
      most noticeable difference between a modded and vanilla-looking cutscene.

  - name: Expressive Facial Animation -Female Edition-
    mod_id: 19181
    phase: 2
    category: Cinematics
    rules:
      after:
        - Conditional Expressions Extended
    notes: >
      Replaces the facial morph files themselves — a wider, less rubbery range
      for every expression the game triggers. Pairs with the male edition.

  - name: Expressive Facial Animation -Male Edition-
    mod_id: 19532
    phase: 2
    category: Cinematics
    rules:
      after:
        - Conditional Expressions Extended

  # -------------------------------------------------------------------------
  # Animation plumbing
  # -------------------------------------------------------------------------
  - name: Animation Motion Revolution
    mod_id: 50258
    phase: 0
    category: Animation
    notes: >
      Fixes the mismatch between an animation's visual displacement and where
      the engine actually moves the actor. Without it, custom animations that
      travel — dodges, traversals, attack lunges — slide or teleport. Phase 0
      because animations load against it.

  - name: EVG Animated Traversal
    mod_id: 63232
    phase: 2
    category: Animation
    rules:
      after:
        - Open Animation Replacer
        - Animation Motion Revolution
    notes: >
      Handmade traversal animations — vaulting ledges, climbing ladders, sliding
      through cramped gaps. The clearest demonstration of what OAR plus AMR buys
      you, and genuinely useful footage material.

  - name: Goetia Animations - Male Idle Walk And Run
    mod_id: 68625
    phase: 2
    category: Animation
    optional: true
    rules:
      after:
        - Open Animation Replacer
    notes: >
      Replacement male locomotion set. Optional because it is a taste call, not
      a capability — take the OAR version of the file, not the plain replacer.

  - name: Pandora Behaviour Engine Plus
    mod_id: 133232
    phase: 3
    category: Tools
    optional: true
    conflicts_with:
      - Project New Reign - Nemesis Unlimited Behavior Engine
    notes: >
      Drop-in alternative to Nemesis — same job, far faster, backwards
      compatible with Nemesis and FNIS patches. Worth it once you are re-running
      the behaviour engine after every animation tweak, which is exactly what
      this overlay causes. Optional and OFF by default: run Pandora or Nemesis,
      never both. If you switch, disable Nemesis in the base list.
